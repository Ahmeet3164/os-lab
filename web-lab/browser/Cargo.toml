[package]
name = "weblab"
version = "0.1.0"
edition = "2021"
description = "Web Lab engine: embedded in-app browser windows with JavaScript injection, driven by the os-lab console"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tiny_http = "0.12"
wry = "0.57"

[[bin]]
name = "weblab"
path = "src/main.rs"
